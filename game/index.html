<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit Dash</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#050810; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; }
canvas { display:block; }
#ui { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:10; }
#hud { position:absolute; top:20px; left:20px; right:20px; display:flex; justify-content:space-between; align-items:flex-start; }
.stat { background:rgba(10,15,40,.75); border:1px solid rgba(80,150,255,.3); border-radius:8px; padding:10px 18px; color:#7fd4ff; font-size:14px; letter-spacing:1px; }
.stat b { color:#fff; font-size:20px; display:block; }
#overlay { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(3,5,15,.85); pointer-events:auto; }
#overlay h1 { font-size:48px; color:#7fd4ff; text-shadow:0 0 20px rgba(80,150,255,.6); margin-bottom:10px; letter-spacing:3px; }
#overlay h2 { font-size:28px; color:#ff6b9d; margin-bottom:30px; }
#overlay p { color:#8ab4d8; font-size:16px; max-width:500px; text-align:center; line-height:1.6; margin-bottom:30px; }
#overlay button { pointer-events:auto; cursor:pointer; background:linear-gradient(135deg,#1a3a6a,#2a5a9a); color:#fff; border:2px solid #4a8acc; border-radius:8px; padding:14px 40px; font-size:20px; letter-spacing:2px; transition:all .2s; }
#overlay button:hover { background:linear-gradient(135deg,#2a5a9a,#3a7aca); box-shadow:0 0 25px rgba(80,150,255,.5); transform:scale(1.05); }
.hidden { display:none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud" class="hidden">
    <div class="stat">SCORE<b id="score">0</b></div>
    <div class="stat">WAVE<b id="wave">1</b></div>
    <div class="stat">LIVES<b id="lives">3</b></div>
  </div>
  <div id="overlay">
    <h1>ORBIT DASH</h1>
    <h2 id="sub">A Space Arcade</h2>
    <p id="desc">Pilot your ship in orbit around a planet. Dodge asteroids, collect stars, and survive as long as you can. Use <b>LEFT/RIGHT</b> or <b>A/D</b> to rotate, <b>SPACE</b> to dash forward.</p>
    <button id="btn">START GAME</button>
  </div>
</div>
<script>
// ===== Orbit Dash — Original arcade game =====
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; cx = W/2; cy = H/2; }
window.addEventListener('resize', resize); resize();

// Game state
const STATE = { TITLE:0, PLAYING:1, GAMEOVER:2, WIN:3 };
let state = STATE.TITLE;

// Player
let ship = { angle:0, radius:180, speed:0, maxSpeed:6, lives:3, invuln:0 };
let score = 0, wave = 1, waveTimer = 0, waveDuration = 1800; // frames ~30s

// Entities
let asteroids = [], stars = [], particles = [], floatTexts = [];

// Input
let keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; if(e.code==='Space') e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Planet
let planetAngle = 0;

// Stars background (parallax)
let bgStars = [];
for(let i=0;i<200;i++) bgStars.push({x:Math.random()*2000, y:Math.random()*2000, z:Math.random(), tw:Math.random()*Math.PI*2});

// Audio (WebAudio, no network)
let audioCtx;
function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
function beep(freq, dur, type='sine', vol=0.15){
  if(!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.value = vol;
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.stop(audioCtx.currentTime + dur);
}
function sfxCollect(){ beep(880,.1,'sine',.1); setTimeout(()=>beep(1320,.1,'sine',.1),80); }
function sfxHit(){ beep(150,.3,'sawtooth',.2); }
function sfxDash(){ beep(440,.05,'square',.08); }
function sfxWave(){ beep(523,.15,'triangle',.12); setTimeout(()=>beep(784,.2,'triangle',.12),150); }

// Particle system
function spawnParticles(x, y, count, color, speed=3, life=40){
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2, s = Math.random()*speed;
    particles.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:life, maxLife:life, color, size:Math.random()*3+1});
  }
}
function floatText(x, y, text, color='#7fd4ff'){
  floatTexts.push({x, y, text, color, life:60, vy:-1});
}

// Asteroid spawn
function spawnAsteroid(){
  const angle = Math.random()*Math.PI*2;
  const dist = Math.max(W, H) * 0.6;
  const speed = 1 + wave*0.3 + Math.random()*1.5;
  const size = 15 + Math.random()*25;
  asteroids.push({
    x: cx + Math.cos(angle)*dist, y: cy + Math.sin(angle)*dist,
    vx: -Math.cos(angle)*speed, vy: -Math.sin(angle)*speed,
    size, rot: Math.random()*Math.PI*2, rotSpeed: (Math.random()-.5)*.1,
    verts: Array.from({length:8}, ()=>0.7+Math.random()*0.6),
    color: `hsl(${20+Math.random()*30},60%,45%)`
  });
}

// Star (collectible)
function spawnStar(){
  const angle = Math.random()*Math.PI*2;
  const dist = 100 + Math.random()*250;
  stars.push({x: cx+Math.cos(angle)*dist, y: cy+Math.sin(angle)*dist, size:8, pulse:Math.random()*Math.PI*2, life:600});
}

// Ship position
function shipPos(){ return {x: cx + Math.cos(ship.angle)*ship.radius, y: cy + Math.sin(ship.angle)*ship.radius}; }

// Update
function update(){
  planetAngle += 0.002;
  if(state !== STATE.PLAYING) return;

  // Rotate
  if(keys['ArrowLeft']||keys['KeyA']) ship.angle -= 0.05;
  if(keys['ArrowRight']||keys['KeyD']) ship.angle += 0.05;

  // Dash
  if((keys['Space']||keys['ArrowUp']||keys['KeyW']) && ship.speed < ship.maxSpeed){
    ship.speed = Math.min(ship.speed + 0.3, ship.maxSpeed);
    if(Math.random()<0.5){
      const p = shipPos();
      spawnParticles(p.x, p.y, 1, '#4a9eff', 2, 20);
    }
    if(Math.random()<0.1) sfxDash();
  } else {
    ship.speed = Math.max(0, ship.speed - 0.05);
  }
  ship.radius -= ship.speed * 0.3;
  if(ship.radius < 60){ ship.radius = 60; }
  if(ship.radius > 250) ship.radius = 250;
  if(ship.invuln > 0) ship.invuln--;

  // Trail
  if(ship.speed > 1){
    const p = shipPos();
    particles.push({x:p.x, y:p.y, vx:0, vy:0, life:20, maxLife:20, color:'#4a9eff', size:3});
  }

  // Wave timer
  waveTimer++;
  if(waveTimer >= waveDuration){
    wave++; waveTimer = 0; waveDuration = Math.max(600, 1800 - wave*80);
    sfxWave(); floatText(cx, cy-100, `WAVE ${wave}`, '#ff6b9d');
  }

  // Spawn
  const spawnRate = Math.max(15, 60 - wave*3);
  if(Math.random() < 1/spawnRate) spawnAsteroid();
  if(Math.random() < 1/120 && stars.length < 5) spawnStar();

  // Update asteroids
  const sp = shipPos();
  for(let i=asteroids.length-1;i>=0;i--){
    const a = asteroids[i];
    a.x += a.vx; a.y += a.vy; a.rot += a.rotSpeed;
    // Collision
    if(ship.invuln <= 0){
      const dx = a.x - sp.x, dy = a.y - sp.y;
      if(Math.hypot(dx,dy) < a.size + 10){
        ship.lives--; ship.invuln = 90; score = Math.max(0, score - 50);
        spawnParticles(sp.x, sp.y, 20, '#ff4466', 5, 40);
        floatText(sp.x, sp.y, '-50', '#ff4466');
        sfxHit();
        // screen shake
        shakeAmount = 15;
        if(ship.lives <= 0){ state = STATE.GAMEOVER; showGameOver(); return; }
      }
    }
    // Off screen
    if(a.x < -100 || a.x > W+100 || a.y < -100 || a.y > H+100){ asteroids.splice(i,1); score += 5; }
  }

  // Update stars
  for(let i=stars.length-1;i>=0;i--){
    const s = stars[i]; s.pulse += 0.1; s.life--;
    const dx = s.x - sp.x, dy = s.y - sp.y;
    if(Math.hypot(dx,dy) < 20){
      score += 100; sfxCollect();
      spawnParticles(s.x, s.y, 15, '#ffdd44', 4, 30);
      floatText(s.x, s.y, '+100', '#ffdd44');
      stars.splice(i,1);
    } else if(s.life <= 0){ stars.splice(i,1); }
  }

  // Update particles
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life--;
    p.vx *= 0.95; p.vy *= 0.95;
    if(p.life <= 0) particles.splice(i,1);
  }

  // Update float texts
  for(let i=floatTexts.length-1;i>=0;i--){
    const f = floatTexts[i]; f.y += f.vy; f.life--;
    if(f.life <= 0) floatTexts.splice(i,1);
  }

  updateHUD();
}

// Screen shake
let shakeAmount = 0;

// Render
function render(){
  ctx.save();
  if(shakeAmount > 0){
    ctx.translate((Math.random()-.5)*shakeAmount, (Math.random()-.5)*shakeAmount);
    shakeAmount *= 0.9;
    if(shakeAmount < 0.5) shakeAmount = 0;
  }

  // Clear
  ctx.fillStyle = '#050810';
  ctx.fillRect(0, 0, W, H);

  // Background stars
  for(const s of bgStars){
    s.tw += 0.02;
    const alpha = 0.3 + Math.sin(s.tw)*0.3;
    ctx.fillStyle = `rgba(150,200,255,${alpha * s.z})`;
    ctx.fillRect(s.x % W, s.y % H, 2*s.z+0.5, 2*s.z+0.5);
  }

  // Nebula glow
  const neb = ctx.createRadialGradient(cx, cy, 50, cx, cy, 400);
  neb.addColorStop(0, 'rgba(40,80,160,0.08)');
  neb.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = neb;
  ctx.fillRect(0,0,W,H);

  // Planet
  const pr = 80;
  // Glow
  const glow = ctx.createRadialGradient(cx, cy, pr, cx, cy, pr+40);
  glow.addColorStop(0, 'rgba(80,150,255,0.3)');
  glow.addColorStop(1, 'rgba(80,150,255,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(cx, cy, pr+40, 0, Math.PI*2); ctx.fill();
  // Body
  const pg = ctx.createRadialGradient(cx-20, cy-20, 5, cx, cy, pr);
  pg.addColorStop(0, '#3a6aaa');
  pg.addColorStop(0.5, '#1a3a6a');
  pg.addColorStop(1, '#0a1a3a');
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.arc(cx, cy, pr, 0, Math.PI*2); ctx.fill();
  // Surface detail
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,pr,0,Math.PI*2); ctx.clip();
  ctx.fillStyle = 'rgba(60,120,200,0.15)';
  for(let i=0;i<5;i++){
    const a = planetAngle + i*1.25;
    ctx.beginPath();
    ctx.ellipse(cx+Math.cos(a)*30, cy+Math.sin(a*1.3)*40, 20, 8, a, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();

  // Orbit ring (dashed)
  ctx.strokeStyle = 'rgba(80,150,255,0.12)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4,8]);
  ctx.beginPath(); ctx.arc(cx, cy, 180, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);

  // Stars
  for(const s of stars){
    const pulse = 1 + Math.sin(s.pulse)*0.3;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.fillStyle = '#ffdd44';
    ctx.shadowColor = '#ffdd44'; ctx.shadowBlur = 15;
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a = (i/5)*Math.PI*2 - Math.PI/2;
      const a2 = a + Math.PI/5;
      ctx.lineTo(Math.cos(a)*s.size*pulse, Math.sin(a)*s.size*pulse);
      ctx.lineTo(Math.cos(a2)*s.size*0.4*pulse, Math.sin(a2)*s.size*0.4*pulse);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // Asteroids
  for(const a of asteroids){
    ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.rot);
    ctx.fillStyle = a.color;
    ctx.strokeStyle = 'rgba(255,200,150,0.3)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    const n = a.verts.length;
    for(let i=0;i<n;i++){
      const ang = (i/n)*Math.PI*2;
      const r = a.size * a.verts[i];
      const x = Math.cos(ang)*r, y = Math.sin(ang)*r;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // Particles
  for(const p of particles){
    const a = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = a;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size*a, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Ship
  const sp = shipPos();
  ctx.save(); ctx.translate(sp.x, sp.y); ctx.rotate(ship.angle + Math.PI/2);
  if(ship.invuln > 0 && Math.floor(ship.invuln/10)%2===0){ ctx.globalAlpha = 0.3; }
  // Ship body
  ctx.fillStyle = '#4a9eff';
  ctx.shadowColor = '#4a9eff'; ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(0,-14); ctx.lineTo(-8,8); ctx.lineTo(0,4); ctx.lineTo(8,8);
  ctx.closePath(); ctx.fill();
  // Cockpit
  ctx.fillStyle = '#88ddff';
  ctx.beginPath(); ctx.arc(0,-3,3,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;

  // Float texts
  for(const f of floatTexts){
    const a = Math.min(1, f.life/30);
    ctx.globalAlpha = a;
    ctx.fillStyle = f.color;
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();
}

// HUD
function updateHUD(){
  document.getElementById('score').textContent = score;
  document.getElementById('wave').textContent = wave;
  document.getElementById('lives').textContent = ship.lives;
}

// Game flow
function startGame(){
  initAudio();
  state = STATE.PLAYING;
  score = 0; wave = 1; waveTimer = 0; waveDuration = 1800;
  asteroids = []; stars = []; particles = []; floatTexts = [];
  ship = { angle:0, radius:180, speed:0, maxSpeed:6, lives:3, invuln:0 };
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  // Spawn initial stars
  for(let i=0;i<3;i++) spawnStar();
}

function showGameOver(){
  state = STATE.GAMEOVER;
  document.getElementById('hud').classList.add('hidden');
  const ov = document.getElementById('overlay');
  ov.classList.remove('hidden');
  ov.querySelector('h1').textContent = 'GAME OVER';
  ov.querySelector('h2').textContent = `Score: ${score} — Wave ${wave}`;
  document.getElementById('desc').innerHTML = 'The asteroids got you. Try again!';
  document.getElementById('btn').textContent = 'PLAY AGAIN';
}

document.getElementById('btn').addEventListener('click', startGame);
window.addEventListener('keydown', e => {
  if(state===STATE.TITLE && e.code==='Enter') startGame();
  if(state===STATE.GAMEOVER && (e.code==='Enter'||e.code==='Space')) startGame();
});

// Main loop
let lastTime = 0;
function loop(t){
  update();
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
